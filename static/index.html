<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFAC Questions</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/static/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="title-row">
            <svg class="roundel" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <circle cx="50" cy="50" r="48" fill="#1f5fbf"/>
                <circle cx="50" cy="50" r="34" fill="#ffffff"/>
                <circle cx="50" cy="50" r="20" fill="#c8102e"/>
            </svg>
            <span>RAFAC Questions</span>
            <svg class="roundel" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <circle cx="50" cy="50" r="48" fill="#1f5fbf"/>
                <circle cx="50" cy="50" r="34" fill="#ffffff"/>
                <circle cx="50" cy="50" r="20" fill="#c8102e"/>
            </svg>
        </h1>
        <div class="header-messages" aria-live="polite">
            <p class="banner banner-error" id="global-error" role="alert" hidden></p>
            <p class="banner banner-ok" id="global-ok" role="status" hidden></p>
        </div>
        <button type="button" class="menu-toggle" id="menu-toggle"
                aria-controls="side-menu" aria-expanded="false" aria-label="Open menu">&#9776;</button>
    </header>
    <div class="menu-overlay" id="menu-overlay" hidden></div>
    <aside class="side-menu" id="side-menu" aria-label="Main menu">
        <div class="side-menu-head">
            <svg class="rail-roundel" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <circle cx="50" cy="50" r="48" fill="#1f5fbf"/>
                <circle cx="50" cy="50" r="34" fill="#ffffff"/>
                <circle cx="50" cy="50" r="20" fill="#c8102e"/>
            </svg>
            <span class="side-menu-title">RAFAC QUESTIONS<small>Squadron learning</small></span>
            <div class="dots-wrap issue-menu-wrap">
                <button type="button" class="menu-issue-btn" id="issue-menu-btn"
                        aria-label="Website issue options" aria-controls="issue-menu" aria-expanded="false">&#8942;</button>
                <div class="dots-menu" id="issue-menu" hidden>
                    <button type="button" id="issue-report-btn">Report a website issue</button>
                </div>
            </div>
        </div>
        <nav class="main-nav" id="main-nav" hidden>
            <!-- nav-learning -->
            <!-- nav-admin -->
        </nav>
        <div class="session-bar" id="session-bar">
            <span id="who"></span>
            <button type="button" class="link-btn" id="login-link">Staff/NCO login</button>
            <button type="button" class="link-btn admin-only" id="change-password-btn" hidden>Change password</button>
            <button type="button" class="link-btn" id="logout-btn" hidden>Log out</button>
        </div>
    </aside>

    <main>
        <!-- views-public -->
        <!-- views-staff -->
        <!-- views-admin -->
    </main>

    <!-- scripts -->
</body>
</html>
